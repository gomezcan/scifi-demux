[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scifi-demux"
version = "0.1.3"  # bump so pip doesn't reuse a cached wheel
description = "Wraps renaming, demultiplexing, mapping, and cleanup scripts for scifi-ATAC FASTQ workflows"
readme = "README.md"
authors = [{ name = "Fabio Gomez", email = "gomezcan@umich.edu" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6",
  "rich>=13",
  "tqdm>=4",
  "pysam>=0.22",
]

[project.scripts]
# If your main Typer app lives in src/scifi_demux/cli/main.py as `app`
scifi-demux = "scifi_demux.cli.main:app"
# If instead it still lives in src/scifi_demux/cli.py as `app`, use this line:
# scifi-demux = "scifi_demux.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scifi_demux = [
  "legacy_scripts/*.pl",
  "legacy_scripts/1_6_scifi_makeTn5bed.py",
  "__data__/**",
]
